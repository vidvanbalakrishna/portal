<style>

/* ═══════════════════════════════════════════════════════════════
   C.00.00 – GLOBAL VARIABLES
   ═══════════════════════════════════════════════════════════ */

:root {

  /* Background layers */
  --bg-layer-1: radial-gradient(circle at 72% 35%, rgba(245,200,130,0.18), transparent 55%);
  --bg-layer-2: radial-gradient(circle at 18% 28%, rgba(180,140,100,0.30), transparent 45%);
  --bg-layer-3: linear-gradient(135deg, #f5e9d0 0%, #f0deb8 50%, #f7f0d8 100%);

  /* Text colors */
  --text-primary: #3b2a2a;
  --text-secondary: #4e3b32;
  --text-accent: #7a1f1f;
  
  /* Navigation colors */
  --nav-link: #6b3a3a;
  --nav-active: #9a7b2f;
  --nav-underline: #c49b3a;
  --nav-bg: rgba(255,255,240,0.96);
  
  /* Border & dividers */
  --border-color: rgba(154,123,47,0.14);

  /* Font families */
  --font-base: "Palatino Linotype", Georgia, serif;
  --font-display: 'Cormorant Garamond', serif;

  /* Body text */
  --body-size-desktop: 1.15rem;
  --body-line-desktop: 2.05;
  --body-letter-desktop: 0.03em;
  --body-size-mobile: 1rem;
  --body-line-mobile: 1.8;
  --body-letter-mobile: 0.03em;

  /* Navigation */
  --nav-height: 80px;
  --nav-padding-x: 28px;
  --nav-padding-y: 0;
  --nav-gap: 32px;
  --nav-link-gap: 28px;
  --nav-link-padding: 6px 2px;
  --logo-height: 62px;
  --content-top: 80px;

  /* Effects */
  --grain-opacity: 0.035;
  --grain-blend: multiply;
  --hover-transition: 0.3s ease;
  --nav-underline-width: 70%;
  --nav-underline-height: 1.5px;
  --nav-underline-transition: 0.35s ease;
}


/* ═══════════════════════════════════════════════════════════════
   C.00.01 – BASE STYLES
   ═══════════════════════════════════════════════════════════ */

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow-x: hidden;
  font-family: var(--font-base);
  background: var(--bg-layer-1), var(--bg-layer-2), var(--bg-layer-3);
  color: var(--text-primary);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

body::before {
  content: '';
  position: fixed;
  top: 0;
  right: 0;
  bottom: 0;
  left: 0;
  pointer-events: none;
  background-image: url('images/grain.png');
  opacity: var(--grain-opacity);
  mix-blend-mode: var(--grain-blend);
  z-index: 9999;
}


/* ═══════════════════════════════════════════════════════════════
   C.00.02 – NAVIGATION PANEL
   ═══════════════════════════════════════════════════════════ */

.nav-panel {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  height: var(--nav-height);
  display: flex;
  flex-direction: row;
  align-items: center;
  justify-content: flex-start;
  gap: var(--nav-gap);
  padding: var(--nav-padding-y) var(--nav-padding-x);
  background: var(--nav-bg);
  border-bottom: 1px solid var(--border-color);
  letter-spacing: 0.08em;
  z-index: 100;
  margin: 0;

overflow-x: auto;
  overflow-y: hidden;
  -webkit-overflow-scrolling: touch;
}

.nav-logo {
  display: block;
  margin: 0;
  padding: 0;
}

.nav-logo img {
  height: var(--logo-height);
  width: auto;
  display: block;
  margin: 0;
  padding: 0;
}

.nav-links {
  display: flex;
  flex-direction: row;
  align-items: center;
  gap: var(--nav-link-gap);
  margin: 0;
  padding: 0;
}

.nav-panel a {
  text-decoration: none;
  color: var(--nav-link);
  font-style: normal;
  font-weight: 400;
  position: relative;
  display: inline-block;
  padding: var(--nav-link-padding);
  transition: color var(--hover-transition), text-shadow var(--hover-transition);
  cursor: pointer;
  margin: 0;

flex-shrink: 0;
  white-space: nowrap;
}

.nav-panel a:hover {
  color: var(--nav-active);
  text-shadow: none;
}

.nav-panel a.active {
  color: var(--nav-active);
  font-weight: 400;
}

.nav-panel a::after {
  content: '';
  position: absolute;
  bottom: 0;
  left: 50%;
  width: 0;
  height: var(--nav-underline-height);
  background: var(--nav-underline);
  transform: translateX(-50%);
  transition: width var(--nav-underline-transition);
}

.nav-panel a.active::after,
.nav-panel a:hover::after {
  width: var(--nav-underline-width);
}
/* Scrollbar styling */
.nav-panel::-webkit-scrollbar {
  height: 8px;
}

.nav-panel::-webkit-scrollbar-track {
  background: rgba(154,123,47,0.15);
  border-radius: 3px;
}

.nav-panel::-webkit-scrollbar-thumb {
  background: rgba(154,123,47,0.6);
  border-radius: 3px;
}

.nav-panel::-webkit-scrollbar-thumb:hover {
  background: rgba(154,123,47,0.85);
}

/* ═══════════════════════════════════════════════════════════════
   C.00.03 – CONTENT WRAPPER
   ═══════════════════════════════════════════════════════════ */

#content {
  position: fixed;
  top: var(--content-top);
  bottom: 0;
  left: 0;
  right: 0;
  overflow-y: auto;
  overflow-x: hidden;
}


/* ═══════════════════════════════════════════════════════════════
   C.01.00 – MEDIA PAGE HEADER
   ═══════════════════════════════════════════════════════════ */

.media-header {
  text-align: center;
  padding: 4rem 2rem 3rem;
  max-width: 1000px;
  margin: 0 auto;
}

.media-title {
  font-family: var(--font-display);
  font-size: 3rem;  /* TWEAK THIS – Title size */
  letter-spacing: 0.06em;
  margin: 0 0 1rem 0;
  font-weight: 500;
  font-style: normal;
  line-height: 1.1;
  color: var(--text-primary);
}

.media-tagline {
  font-family: var(--font-display);
  font-size: 1.2rem;  /* TWEAK THIS – Tagline size */
  letter-spacing: 0.12em;
  color: var(--text-accent);
  opacity: 0.85;
  font-weight: 400;
  font-style: normal;
  line-height: 1.4;
  margin: 0;
}


/* ═══════════════════════════════════════════════════════════════
   C.02.00 – ACCORDION SECTIONS
   ═══════════════════════════════════════════════════════════ */

.media-container {
  max-width: 1000px;  /* TWEAK THIS – Content max width */
  margin: 0 auto;
  padding: 0 2rem 5rem;
}

.accordion-section {
  margin-bottom: 2rem;  /* TWEAK THIS – Space between sections */
  border: 1px solid rgba(154,123,47,0.2);
  border-radius: 8px;
  background: rgba(255,255,240,0.4);
  overflow: hidden;
  transition: all 0.3s ease;
}

.accordion-section:hover {
  border-color: rgba(154,123,47,0.35);
  box-shadow: 0 2px 8px rgba(122,31,31,0.08);
}

.accordion-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 1.5rem 2rem;  /* TWEAK THIS – Header padding */
  cursor: pointer;
  background: rgba(255,252,240,0.6);
  transition: all 0.3s ease;
  user-select: none;
}

.accordion-header:hover {
  background: rgba(255,252,240,0.85);
}

.accordion-title {
  font-family: var(--font-display);
  font-size: 1.6rem;  /* TWEAK THIS – Category title size */
  font-weight: 500;
  color: var(--text-primary);
  letter-spacing: 0.04em;
  margin: 0;
}

.accordion-count {
  font-size: 0.9rem;
  color: var(--text-accent);
  opacity: 0.7;
  margin-left: 0.8rem;
}

.accordion-icon {
  font-size: 1.4rem;
  color: #9a7b2f;
  transition: transform 0.3s ease;
}

.accordion-section.active .accordion-icon {
  transform: rotate(180deg);
}

.accordion-content {
  max-height: 0;
  overflow: hidden;
  transition: max-height 0.4s ease;
}

.accordion-section.active .accordion-content {
  max-height: 10000px;  /* Large enough to show all content */
}


.video-grid-wrapper {
  position: relative;
  padding: 2rem;
}

.video-grid {
  display: flex;
  gap: 1.5rem;  /* TWEAK THIS – Space between cards */
  overflow-x: auto;
  scroll-behavior: smooth;
  padding: 1rem 0;
  scrollbar-width: none;  /* Hide scrollbar Firefox */
}

.video-grid::-webkit-scrollbar {
  display: none;  /* Hide scrollbar Chrome/Safari */
}

.video-grid .video-card {
  flex: 0 0 320px;  /* TWEAK THIS – Card width */
  max-width: 320px;
}

.scroll-btn {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  width: 48px;  /* TWEAK THIS – Larger button size */
  height: 48px;
background: linear-gradient(135deg, rgba(139,69,19,0.15), rgba(122,31,31,0.12));  /* TWEAK THIS – Maroon background */
border: 2px solid #7a1f1f;  /* TWEAK THIS – Maroon border */
color: #7a1f1f;  /* TWEAK THIS – Maroon arrow color */ 

  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  font-size: 24px;  /* TWEAK THIS – Larger arrow */
  font-weight: 700;
 
  z-index: 10;
  transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
  box-shadow: 
    0 3px 10px rgba(122,31,31,0.2),
    inset 0 1px 0 rgba(255,255,255,0.6);
  animation: scrollPulse 3s ease-in-out infinite;  /* TWEAK THIS – Breathing animation */
}

@keyframes scrollPulse {
  0%, 100% { 
    box-shadow: 
      0 3px 10px rgba(122,31,31,0.2),
      inset 0 1px 0 rgba(255,255,255,0.6);
    transform: translateY(-50%) scale(1);
  }
  50% { 
    box-shadow: 
      0 4px 14px rgba(154,123,47,0.3),
      inset 0 1px 0 rgba(255,255,255,0.8);
    transform: translateY(-50%) scale(1.05);
  }
}

.scroll-btn:hover {
  background: linear-gradient(135deg, rgba(255,248,230,1), rgba(255,252,240,1));
  border-color: #9a7b2f;
  color: #7a1f1f;
  box-shadow: 
    0 5px 18px rgba(154,123,47,0.35),
    inset 0 1px 0 rgba(255,255,255,0.9);
  transform: translateY(-50%) scale(1.15);
  animation: none;  /* Stop breathing on hover */
}

.scroll-btn:active {
  transform: translateY(-50%) scale(1.05);
  box-shadow: 
    0 2px 8px rgba(122,31,31,0.2),
    inset 0 1px 0 rgba(255,255,255,0.5);
}



.scroll-btn.left {
  left: 1rem;  /* TWEAK THIS – Distance from left edge */
}

.scroll-btn.right {
  right: 1rem;  /* TWEAK THIS – Distance from right edge */
}



/* ═══════════════════════════════════════════════════════════════
   C.03.00 – VIDEO CARDS
   ═══════════════════════════════════════════════════════════ */

.video-card {
  background: rgba(255,255,240,0.8);
  border: 1px solid rgba(154,123,47,0.15);
  border-radius: 8px;
  overflow: hidden;
  transition: all 0.3s ease;
  cursor: pointer;
}

.video-card:hover {
  transform: translateY(-4px);
  box-shadow: 0 6px 16px rgba(122,31,31,0.15);
  border-color: rgba(154,123,47,0.3);
}

.video-thumbnail {
  position: relative;
  width: 100%;
  padding-top: 56.25%;  /* 16:9 aspect ratio */
  background: #e0e0e0;
  overflow: hidden;
}

.video-thumbnail img {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.video-play-icon {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 60px;
  height: 60px;
  background: rgba(154,123,47,0.9);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.3s ease;
}

.video-card:hover .video-play-icon {
  background: rgba(122,31,31,0.95);
  transform: translate(-50%, -50%) scale(1.1);
}

.video-play-icon::after {
  content: '▶';
  color: white;
  font-size: 24px;
  margin-left: 4px;
}

.video-info {
  padding: 1.2rem;
}

.video-title {
  font-size: 1.05rem;
  font-weight: 500;
  color: var(--text-primary);
  margin: 0 0 0.6rem 0;
  line-height: 1.4;
  display: -webkit-box;
  -webkit-line-clamp: 2;  /* TWEAK THIS – Max lines for title */
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.video-synopsis {
  font-size: 0.9rem;
  color: var(--text-secondary);
  line-height: 1.6;
  margin: 0;
  display: -webkit-box;
  -webkit-line-clamp: 3;  /* TWEAK THIS – Max lines for synopsis */
  -webkit-box-orient: vertical;
  overflow: hidden;
  opacity: 0.85;
}


/* ═══════════════════════════════════════════════════════════════
   C.04.00 – VIDEO MODAL
   ═══════════════════════════════════════════════════════════ */

.video-modal {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: rgba(0,0,0,0.9);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 1000;
  padding: 2rem;
}

.video-modal.active {
  display: flex;
}

.modal-content {
  position: relative;
  width: 100%;
  max-width: 1200px;  /* TWEAK THIS – Max video width */
  background: #000;
  border-radius: 8px;
  overflow: hidden;
}

.modal-close {
  position: absolute;
  top: -40px;
  right: 0;
  background: none;
  border: none;
  color: white;
  font-size: 2rem;
  cursor: pointer;
  padding: 0.5rem;
  transition: all 0.3s ease;
  z-index: 1001;
}

.modal-close:hover {
  color: #9a7b2f;
  transform: scale(1.1);
}

.video-player {
  position: relative;
  width: 100%;
  padding-top: 56.25%;  /* 16:9 */
}

.video-player iframe {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  border: none;
}

.fallback-message {
  padding: 3rem 2rem;
  text-align: center;
  color: white;
}

.fallback-message p {
  font-size: 1.1rem;
  margin-bottom: 1.5rem;
}

.youtube-link-btn {
  display: inline-block;
  padding: 0.8rem 2rem;
  background: #9a7b2f;
  color: white;
  text-decoration: none;
  border-radius: 4px;
  font-weight: 500;
  transition: all 0.3s ease;
}

.youtube-link-btn:hover {
  background: #7a1f1f;
  transform: translateY(-2px);
}


/* ═══════════════════════════════════════════════════════════════
   C.05.00 – MOBILE RESPONSIVE
   ═══════════════════════════════════════════════════════════ */

@media (max-width: 900px) {
  
  .media-header {
    padding: 2.5rem 1.5rem 2rem;
  }
  
  .media-title {
    font-size: 2.2rem;
  }
  
  .media-tagline {
    font-size: 1.05rem;
  }
  
  .media-container {
    padding: 0 1rem 4rem;
  }
  
  .accordion-header {
    padding: 1.2rem 1.5rem;
  }
  
  .accordion-title {
    font-size: 1.3rem;
  }
  
  .video-grid {
    grid-template-columns: 1fr;
    gap: 1.2rem;
    padding: 1.5rem;
  }
  
  .modal-close {
    top: -35px;
    font-size: 1.8rem;
  }
}

</style>

/* J.00.02 – Extract YouTube ID */
function getYouTubeID(url) {
  const regex = /(?:youtube\.com\/watch\?v=|youtu\.be\/)([^&]+)/;
  const match = url.match(regex);
  return match ? match[1] : null;
}

/* J.00.03 – Get thumbnail */
function getThumbnail(videoID) {
  return `https://img.youtube.com/vi/${videoID}/hqdefault.jpg`;
}

/* J.00.04 – Create card */
function createVideoCard(video) {
  const videoID = getYouTubeID(video.url);
  const thumbnail = getThumbnail(videoID);
  
  return `
    <div class="video-card" onclick="openVideo('${videoID}', '${video.url}')">
      <div class="video-thumbnail">
        <img src="${thumbnail}" alt="${video.title}">
        <div class="video-play-icon"></div>
      </div>
      <div class="video-info">
        <h3 class="video-title">${video.title}</h3>
        <p class="video-synopsis">${video.synopsis}</p>
      </div>
    </div>
  `;
}

/* J.00.05 – Populate grids */
function populateVideos() {
  document.getElementById('live-concerts-grid').innerHTML = 
    videoData.liveConcerts.map(createVideoCard).join('');
  
  document.getElementById('thematic-grid').innerHTML = 
    videoData.thematic.map(createVideoCard).join('');
  
  document.getElementById('special-projects-grid').innerHTML = 
    videoData.specialProjects.map(createVideoCard).join('');
  
  document.getElementById('individual-pieces-grid').innerHTML = 
    videoData.individualPieces.map(createVideoCard).join('');
}

/* J.00.06 – Accordion */
const accordionHeaders = document.querySelectorAll('.accordion-header');

accordionHeaders.forEach(header => {
  header.addEventListener('click', () => {
    const section = header.parentElement;
    section.classList.toggle('active');
  });
});

/* J.00.06.5 – Horizontal scroll function */
function scrollVideos(gridId, direction) {
  const grid = document.getElementById(gridId);
  const scrollAmount = 340;  /* TWEAK THIS – Scroll distance per click */
  grid.scrollLeft += direction * scrollAmount;
}



/* J.00.07 – Open video */
function openVideo(videoID, fallbackURL) {
  const modal = document.getElementById('videoModal');
  const player = document.getElementById('videoPlayer');
  
  player.innerHTML = `
    <iframe 
      src="https://www.youtube.com/embed/${videoID}?autoplay=1" 
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
      allowfullscreen>
    </iframe>
  `;
  
  modal.classList.add('active');
  document.body.style.overflow = 'hidden';
}

/* J.00.08 – Close modal */
document.getElementById('modalClose').addEventListener('click', () => {
  const modal = document.getElementById('videoModal');
  const player = document.getElementById('videoPlayer');
  
  modal.classList.remove('active');
  player.innerHTML = '';
  document.body.style.overflow = 'auto';
});

document.getElementById('videoModal').addEventListener('click', (e) => {
  if (e.target.id === 'videoModal') {
    document.getElementById('modalClose').click();
  }
});

/* J.00.09 – Initialize */
window.addEventListener('DOMContentLoaded', () => {
  populateVideos();
});

/* Close modal on ESC key */
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    const modal = document.getElementById('videoModal');
    if (modal.classList.contains('active')) {
      document.getElementById('modalClose').click();
    }
  }
});


</script>
