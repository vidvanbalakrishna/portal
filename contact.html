<style>


:root {
  --h1-size-desktop: 3.8rem;
  --h1-letter-desktop: 0.06em;
  --h1-line-desktop: 1.05;
  
  --h1-size-mobile: 2.4rem;
  --h1-letter-mobile: 0.05em;
  --h1-line-mobile: 1.1;
  
  --subtitle-size-desktop: 1.15rem;
  --subtitle-letter-desktop: 0.16em;
  --subtitle-line-desktop: 1.4;
  
  --subtitle-size-mobile: 1.05rem;
  --subtitle-letter-mobile: 0.12em;
  
  --section-gap-desktop: 6rem;
  --section-gap-mobile: 3rem;
  
  --text-gap-small: 0.6rem;
  --text-gap-large: 2.2rem;
  
  --img-saturate: 0.95;
  --img-contrast: 1.02;
}


/* ═══════════════════════════════════════════════════════════════
   C.01.00 – PAGE HEADER
   ═══════════════════════════════════════════════════════════ */

.contact-header{
  text-align:center;
 padding:var(--section-gap-desktop) 1rem 0.2rem;   /* smaller bottom space */
}

.contact-title{
  font-family:var(--font-display);
  font-size:var(--h1-size-desktop);
  letter-spacing:var(--h1-letter-desktop);
  line-height:var(--h1-line-desktop);
  margin:0 0 var(--text-gap-small);
  font-weight:500;
  color:var(--text-primary);
}

.contact-subtitle{
  font-family:var(--font-display);
  font-size:var(--subtitle-size-desktop);
  letter-spacing:var(--subtitle-letter-desktop);
  line-height:var(--subtitle-line-desktop);
  color:var(--text-accent);
  opacity:0.85;
  margin:0;
}


/* ═══════════════════════════════════════════════════════════════
   C.02.00 – CONTACT BLOCK
   ═══════════════════════════════════════════════════════════ */

.contact-section{
  max-width:800px;
  margin:var(--section-gap-desktop) auto;
  padding:0 2rem;
  text-align:center;
}

.contact-logo{
  width:120px;
  height:auto;
  margin-bottom:var(--text-gap-large);
  opacity:0.85;
  transition:transform var(--hover-transition);
}

.contact-logo:hover{
  transform:scale(1.05);
}

.string-divider{
  width:60%;
  height:1px;
  margin:var(--section-gap-desktop) auto;
  background:var(--border-color);
}


/* ═══════════════════════════════════════════════════════════════
   C.03.00 – ICON GRID
   ═══════════════════════════════════════════════════════════ */

.contact-icons{
  display:grid;
  grid-template-columns:repeat(4, 1fr);
  gap:3rem;
  margin-top:2rem;   /* smaller space below subtitle */
}

.contact-icon{
  display:block;
  transition:transform var(--hover-transition);
}

.contact-icon img{
  width:100%;
  height:auto;
  display:block;
  filter:saturate(var(--img-saturate)) contrast(var(--img-contrast));
}

.contact-icon:hover{
  transform:translateY(-6px);
}


/* ═══════════════════════════════════════════════════════════════
   C.04.00 – MOBILE
   ═══════════════════════════════════════════════════════════ */

@media (max-width:900px){

  .contact-title{
    font-size:var(--h1-size-mobile);
    letter-spacing:var(--h1-letter-mobile);
    line-height:var(--h1-line-mobile);
  }

  .contact-subtitle{
    font-size:var(--subtitle-size-mobile);
    letter-spacing:var(--subtitle-letter-mobile);
  }

  .contact-icons{
    grid-template-columns:repeat(2, 1fr);
    gap:2rem;
  }

  .contact-logo{
    width:90px;
  }

}

</style>
</head>
