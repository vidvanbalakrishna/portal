<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>D. Balakrishna | Gallery</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="global-variables.css">
<style>

/* ═══════════════════════════════════════════════════════════════
   C.01.00 – GALLERY PAGE HEADER
   ═══════════════════════════════════════════════════════════ */

.gallery-header {
  text-align: center;
  padding: 4rem 2rem 3rem;
  max-width: 1000px;
  margin: 0 auto;
}

.gallery-title {
  font-family: var(--font-display);
  font-size: 3rem;
  letter-spacing: 0.06em;
  margin: 0 0 1rem 0;
  font-weight: 500;
  font-style: normal;
  line-height: 1.1;
  color: var(--text-primary);
}

.gallery-tagline {
  font-family: var(--font-display);
  font-size: 1.2rem;
  letter-spacing: 0.12em;
  color: var(--text-accent);
  opacity: 0.85;
  font-weight: 400;
  font-style: normal;
  line-height: 1.4;
  margin: 0;
}

/* ═══════════════════════════════════════════════════════════════
   C.02.00 – ACCORDION SECTIONS
   ═══════════════════════════════════════════════════════════ */

.gallery-container {
  max-width: 1000px;
  margin: 0 auto;
  padding: 0 2rem 5rem;
}

.accordion-section {
  margin-bottom: 2rem;
  border: 1px solid rgba(154,123,47,0.2);
  border-radius: 8px;
  background: rgba(255,255,240,0.4);
  overflow: hidden;
  transition: all 0.3s ease;
}

.accordion-section:hover {
  border-color: rgba(154,123,47,0.35);
  box-shadow: 0 2px 8px rgba(122,31,31,0.08);
}

.accordion-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 1.5rem 2rem;
  cursor: pointer;
  background: rgba(255,252,240,0.6);
  transition: all 0.3s ease;
  user-select: none;
}

.accordion-header:hover {
  background: rgba(255,252,240,0.85);
}

.accordion-title {
  font-family: var(--font-display);
  font-size: 1.6rem;
  font-weight: 500;
  color: var(--text-primary);
  letter-spacing: 0.04em;
  margin: 0;
}

.accordion-icon {
  font-size: 1.4rem;
  color: #9a7b2f;
  transition: transform 0.3s ease;
}

.accordion-section.active .accordion-icon {
  transform: rotate(180deg);
}

.accordion-content {
  max-height: 0;
  overflow: hidden;
  transition: max-height 0.4s ease;
}

.accordion-section.active .accordion-content {
  max-height: 10000px;
}


/* ═══════════════════════════════════════════════════════════════
   C.03.00 – GALLERY GRID
   ═══════════════════════════════════════════════════════════ */

.gallery-grid-wrapper {
  position: relative;
  padding: 2rem;
}

.gallery-grid {
  display: flex;
  gap: 1.5rem;
  overflow-x: auto;
  scroll-behavior: smooth;
  padding: 1rem 0;
  scrollbar-width: none;
}

.gallery-grid::-webkit-scrollbar {
  display: none;
}

.gallery-grid .gallery-item {
  flex: 0 0 320px;
  max-width: 320px;
}

.scroll-btn {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  width: 48px;
  height: 48px;
  background: linear-gradient(135deg, rgba(139,69,19,0.15), rgba(122,31,31,0.12));
  border: 2px solid #7a1f1f;
  color: #7a1f1f;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  font-size: 24px;
  font-weight: 700;
  z-index: 10;
  transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
  box-shadow: 
    0 3px 10px rgba(122,31,31,0.2),
    inset 0 1px 0 rgba(255,255,255,0.6);
  animation: scrollPulse 3s ease-in-out infinite;
}

@keyframes scrollPulse {
  0%, 100% { 
    box-shadow: 
      0 3px 10px rgba(122,31,31,0.2),
      inset 0 1px 0 rgba(255,255,255,0.6);
    transform: translateY(-50%) scale(1);
  }
  50% { 
    box-shadow: 
      0 4px 14px rgba(154,123,47,0.3),
      inset 0 1px 0 rgba(255,255,255,0.8);
    transform: translateY(-50%) scale(1.05);
  }
}

.scroll-btn:hover {
  background: linear-gradient(135deg, rgba(255,248,230,1), rgba(255,252,240,1));
  border-color: #9a7b2f;
  color: #7a1f1f;
  box-shadow: 
    0 5px 18px rgba(154,123,47,0.35),
    inset 0 1px 0 rgba(255,255,255,0.9);
  transform: translateY(-50%) scale(1.15);
  animation: none;
}

.scroll-btn:active {
  transform: translateY(-50%) scale(1.05);
  box-shadow: 
    0 2px 8px rgba(122,31,31,0.2),
    inset 0 1px 0 rgba(255,255,255,0.5);
}

.scroll-btn.left {
  left: 1rem;
}

.scroll-btn.right {
  right: 1rem;
}


/* ═══════════════════════════════════════════════════════════════
   C.04.00 – GALLERY CARDS
   ═══════════════════════════════════════════════════════════ */

.gallery-item {
  background: #fff;
  border-radius: 8px;
  overflow: hidden;
  box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  transition: all 0.3s ease;
  cursor: pointer;
}

.gallery-item:hover {
  transform: translateY(-4px);
  box-shadow: 0 8px 20px rgba(0,0,0,0.12);
}

.gallery-item-image {
  width: 100%;
  height: 240px;
  background: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 15px;
  box-sizing: border-box;
  border-bottom: 1px solid rgba(154,123,47,0.15);
}

.gallery-item img {
  max-width: 100%;
  max-height: 100%;
  object-fit: contain;
  display: block;
}

.gallery-item-synopsis {
  padding: 1rem;
  font-size: 0.9rem;
  line-height: 1.4;
  color: var(--text-secondary);
  text-align: center;
  min-height: 60px;
  display: flex;
  align-items: center;
  justify-content: center;
}


/* ═══════════════════════════════════════════════════════════════
   C.05.00 – LIGHTBOX MODAL
   ═══════════════════════════════════════════════════════════ */

.lightbox-modal {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: rgba(0,0,0,0.94);
  z-index: 9998;
  display: none;
  align-items: center;
  justify-content: center;
  opacity: 0;
  transition: opacity 0.3s ease;
}

.lightbox-modal.active {
  display: flex;
  opacity: 1;
}

.lightbox-container {
  position: relative;
  width: 90vw;
  height: 90vh;
  display: flex;
  align-items: center;
  justify-content: center;
}

.lightbox-image-wrapper {
  position: relative;
  width: 100%;
  height: 100%;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: grab;
}

.lightbox-image-wrapper.dragging {
  cursor: grabbing;
}

.lightbox-image {
  max-width: 100%;
  max-height: 100%;
  object-fit: contain;
  display: block;
  transition: transform 0.2s ease;
  transform-origin: center center;
}

.lightbox-close {
  position: absolute;
  top: 24px;
  right: 24px;
  width: 56px;
  height: 56px;
  background: rgba(255,255,255,0.90);
  border: 2px solid rgba(255,255,255,0.95);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  font-size: 32px;
  color: #222;
  transition: all 0.3s ease;
  z-index: 10;
  box-shadow: 0 2px 8px rgba(0,0,0,0.30);
}

.lightbox-close:hover {
  background: #ffffff;
  transform: scale(1.12);
}

.lightbox-nav {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  width: 56px;
  height: 56px;
  background: rgba(255,255,255,0.90);
  border: 2px solid rgba(255,255,255,0.95);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  font-size: 28px;
  color: #222;
  transition: all 0.3s ease;
  z-index: 10;
  box-shadow: 0 2px 8px rgba(0,0,0,0.30);
}

.lightbox-nav:hover {
  background: #ffffff;
  transform: translateY(-50%) scale(1.12);
}

.lightbox-nav.prev {
  left: 24px;
}

.lightbox-nav.next {
  right: 24px;
}

.zoom-controls {
  position: absolute;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 14px;
  z-index: 10;
  background: rgba(0,0,0,0.60);
  padding: 12px 16px;
  border-radius: 40px;
}

.zoom-btn {
  width: 50px;
  height: 50px;
  background: rgba(255,255,255,0.90);
  border: 2px solid rgba(255,255,255,0.95);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  font-size: 24px;
  color: #222;
  transition: all 0.3s ease;
  user-select: none;
  font-weight: 500;
  box-shadow: 0 2px 8px rgba(0,0,0,0.25);
}

.zoom-btn:hover {
  background: #ffffff;
  transform: scale(1.12);
}

.text-overlay-btn {
  position: absolute;
  bottom: 24px;
  right: 24px;
  padding: 14px 28px;
  background: rgba(255,255,255,0.90);
  border: 2px solid rgba(255,255,255,0.95);
  border-radius: 30px;
  color: #222;
  font-family: var(--font-base);
  font-size: 0.95rem;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.3s ease;
  z-index: 10;
  display: none;
  letter-spacing: 0.05em;
  box-shadow: 0 2px 8px rgba(0,0,0,0.30);
}

.text-overlay-btn:hover {
  background: #ffffff;
  transform: scale(1.08);
}

.text-overlay-btn.visible {
  display: block;
}

.text-overlay {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: rgba(0,0,0,0.90);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 15;
  padding: 80px;
  overflow-y: auto;
}

.text-overlay.active {
  display: flex;
}

.text-content {
  background: rgba(255,255,255,0.97);
  padding: 50px;
  border-radius: 8px;
  max-width: 900px;
  width: 100%;
  font-family: var(--font-base);
  font-size: 1.1rem;
  line-height: 1.9;
  color: var(--text-primary);
  position: relative;
  box-shadow: 0 4px 16px rgba(0,0,0,0.30);
}

.text-close {
  position: absolute;
  top: 20px;
  right: 20px;
  width: 40px;
  height: 40px;
  background: rgba(0,0,0,0.08);
  border: none;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  font-size: 22px;
  color: var(--text-primary);
  transition: all 0.3s ease;
}

.text-close:hover {
  background: rgba(0,0,0,0.14);
  transform: scale(1.1);
}


/* ═══════════════════════════════════════════════════════════════
   C.06.00 – MOBILE MODE (max-width: 900px)
   ═══════════════════════════════════════════════════════════ */

@media (max-width: 900px) {
  .gallery-container {
    padding: 0 1rem 4rem;
  }
  
  .accordion-header {
    padding: 1.2rem 1.5rem;
  }
  
  .accordion-title {
    font-size: 1.3rem;
  }
  
  .gallery-grid {
    gap: 1.2rem;
    padding: 1.5rem;
  }
  
  .gallery-grid .gallery-item {
    flex: 0 0 260px;
    max-width: 260px;
  }
  
  .gallery-item-image {
    height: 200px;
  }
  
  .lightbox-nav,
  .lightbox-close {
    width: 48px;
    height: 48px;
    font-size: 24px;
  }
  
  .zoom-btn {
    width: 44px;
    height: 44px;
    font-size: 20px;
  }
  
  .text-overlay {
    padding: 40px 20px;
  }
  
  .text-content {
    padding: 40px 24px;
    font-size: 1rem;
  }
}

</style>
</head>
<body>

<!-- ═══════════════════════════════════════════════════════════════
     H.00.00 – NAVIGATION PANEL
     ═══════════════════════════════════════════════════════════ -->

<div id="nav-placeholder"></div>
<script src="nav.js"></script>


<!-- ═══════════════════════════════════════════════════════════════
     H.01.00 – CONTENT WRAPPER
     ═══════════════════════════════════════════════════════════ -->

<div id="content">

<div class="gallery-header">
    <h1 class="gallery-title">Gallery</h1>
    <p class="gallery-tagline">Press & Photographs</p>
  </div>

  <div class="gallery-container">

    <div class="accordion-section active">
      <div class="accordion-header">
        <h2 class="accordion-title">Press Clips</h2>
        <span class="accordion-icon">▼</span>
      </div>
      <div class="accordion-content">
        <div class="gallery-grid-wrapper">
          <div class="scroll-btn left" onclick="scrollGallery('press-grid', -1)">‹</div>
          <div class="scroll-btn right" onclick="scrollGallery('press-grid', 1)">›</div>
          <div class="gallery-grid" id="press-grid"></div>
        </div>
      </div>
    </div>

    <div class="accordion-section">
      <div class="accordion-header">
        <h2 class="accordion-title">Photographs</h2>
        <span class="accordion-icon">▼</span>
      </div>
      <div class="accordion-content">
        <div class="gallery-grid-wrapper">
          <div class="scroll-btn left" onclick="scrollGallery('photos-grid', -1)">‹</div>
          <div class="scroll-btn right" onclick="scrollGallery('photos-grid', 1)">›</div>
          <div class="gallery-grid" id="photos-grid"></div>
        </div>
      </div>
    </div>

  </div>

</div>


<!-- ═══════════════════════════════════════════════════════════════
     H.02.00 – LIGHTBOX MODAL
     ═══════════════════════════════════════════════════════════ -->

<div class="lightbox-modal" id="lightboxModal">
  <div class="lightbox-container">
    <div class="lightbox-close" id="lightboxClose">×</div>
    <div class="lightbox-nav prev" id="prevImage">‹</div>
    <div class="lightbox-nav next" id="nextImage">›</div>
    <div class="lightbox-image-wrapper" id="imageWrapper">
      <img class="lightbox-image" id="lightboxImage" src="" alt="">
    </div>
    <div class="zoom-controls">
      <div class="zoom-btn" id="zoomOut">−</div>
      <div class="zoom-btn" id="zoomReset">⊙</div>
      <div class="zoom-btn" id="zoomIn">+</div>
    </div>
    <div class="text-overlay-btn" id="readTextBtn">READ TEXT</div>
    <div class="text-overlay" id="textOverlay">
      <div class="text-content">
        <div class="text-close" id="textClose">×</div>
        <p id="textContent">Text content will appear here.</p>
      </div>
    </div>
  </div>
</div>


<!-- ═══════════════════════════════════════════════════════════════
     J.00.00 – JAVASCRIPT
     ═══════════════════════════════════════════════════════════ -->

<script>

const galleryData = {
  press: [
    { image: 'images/press/press-01.jpg', text: 'Full article text', synopsis: 'Music academy concert' },
    { image: 'images/press/press-02.jpg', text: 'Full article text', synopsis: 'Performance highlights' },
    { image: 'images/press/press-03.jpg', text: 'Full article text', synopsis: 'Concert coverage' },
    { image: 'images/press/press-04.jpg', text: 'Full article text', synopsis: 'Media feature' },
    { image: 'images/press/press-05.jpg', text: 'Full article text', synopsis: 'Artist profile' },
    { image: 'images/press/press-06.jpg', text: 'Full article text', synopsis: 'Concert review' },
    { image: 'images/press/press-07.jpg', text: 'Full article text', synopsis: 'Festival performance' },
    { image: 'images/press/press-08.jpg', text: 'Full article text', synopsis: 'Press coverage' },
    { image: 'images/press/press-09.jpg', text: 'Full article text', synopsis: 'Concert announcement' },
    { image: 'images/press/press-10.jpg', text: 'Full article text', synopsis: 'Performance review' },
    { image: 'images/press/press-11.jpeg', text: 'Full article text', synopsis: 'Music feature' },
    { image: 'images/press/press-12.jpeg', text: 'Full article text', synopsis: 'Concert highlights' },
    { image: 'images/press/press-13.jpeg', text: 'Full article text', synopsis: 'Media article' },
    { image: 'images/press/press-14.jpeg', text: 'Full article text', synopsis: 'Festival coverage' },
    { image: 'images/press/press-15.jpeg', text: 'Full article text', synopsis: 'Press feature' },
    { image: 'images/press/press-17.jpeg', text: 'Full article text', synopsis: 'Concert review' },
    { image: 'images/press/press-18.jpeg', text: 'Full article text', synopsis: 'Performance article' },
    { image: 'images/press/press-19.jpeg', text: 'Full article text', synopsis: 'Media coverage' },
    { image: 'images/press/press-20.jpeg', text: 'Full article text', synopsis: 'Concert feature' },
    { image: 'images/press/press-21.jpg', text: 'Full article text', synopsis: 'Press article' }
  ],
  photos: [
    { image: 'images/gallery/01.jpg', synopsis: 'Performance photograph' },
    { image: 'images/gallery/02.jpg', synopsis: 'Performance photograph' },
    { image: 'images/gallery/03.jpg', synopsis: 'Performance photograph' },
    { image: 'images/gallery/04.jpg', synopsis: 'Performance photograph' },
    { image: 'images/gallery/05.jpg', synopsis: 'Performance photograph' },
    { image: 'images/gallery/06.jpg', synopsis: 'Performance photograph' },
    { image: 'images/gallery/07.jpg', synopsis: 'Performance photograph' },
    { image: 'images/gallery/08.jpg', synopsis: 'Performance photograph' },
    { image: 'images/gallery/09.jpg', synopsis: 'Performance photograph' },
    { image: 'images/gallery/10.jpg', synopsis: 'Performance photograph' },
    { image: 'images/gallery/11.jpg', synopsis: 'Performance photograph' },



  ]
};

function populateGallery() {
  const pressGrid = document.getElementById('press-grid');
  const photosGrid = document.getElementById('photos-grid');
  
  galleryData.press.forEach((item, index) => {
    const div = document.createElement('div');
    div.className = 'gallery-item';
    div.onclick = () => openLightbox('press', index);
    div.innerHTML = `
      <div class="gallery-item-image">
        <img src="${item.image}" alt="Press Clip ${index + 1}">
      </div>
      <div class="gallery-item-synopsis">${item.synopsis}</div>
    `;
    pressGrid.appendChild(div);
  });
  
  galleryData.photos.forEach((item, index) => {
    const div = document.createElement('div');
    div.className = 'gallery-item';
    div.onclick = () => openLightbox('photos', index);
    div.innerHTML = `
      <div class="gallery-item-image">
        <img src="${item.image}" alt="Photo ${index + 1}">
      </div>
      <div class="gallery-item-synopsis">${item.synopsis}</div>
    `;
    photosGrid.appendChild(div);
  });
}

function scrollGallery(gridId, direction) {
  document.getElementById(gridId).scrollLeft += direction * 340;
}

document.querySelectorAll('.accordion-header').forEach(header => {
  header.addEventListener('click', () => {
    header.parentElement.classList.toggle('active');
  });
});

let currentCategory = '';
let currentIndex = 0;
let zoomLevel = 1;
let panX = 0;
let panY = 0;
let isDragging = false;
let startX = 0;
let startY = 0;

function openLightbox(category, index) {
  currentCategory = category;
  currentIndex = index;
  zoomLevel = 1;
  panX = 0;
  panY = 0;
  
  const modal = document.getElementById('lightboxModal');
  const image = document.getElementById('lightboxImage');
  const readTextBtn = document.getElementById('readTextBtn');
  
  image.src = galleryData[category][index].image;
  
  if (category === 'press') {
    readTextBtn.classList.add('visible');
  } else {
    readTextBtn.classList.remove('visible');
  }
  
  updateTransform();
  modal.classList.add('active');
  document.body.style.overflow = 'hidden';
}

function closeLightbox() {
  document.getElementById('lightboxModal').classList.remove('active');
  document.getElementById('textOverlay').classList.remove('active');
  document.body.style.overflow = 'auto';
}

function navigateImage(direction) {
  const items = galleryData[currentCategory];
  currentIndex = (currentIndex + direction + items.length) % items.length;
  
  const image = document.getElementById('lightboxImage');
  const readTextBtn = document.getElementById('readTextBtn');
  
  image.src = items[currentIndex].image;
  
  if (currentCategory === 'press') {
    readTextBtn.classList.add('visible');
  } else {
    readTextBtn.classList.remove('visible');
  }
  
  zoomLevel = 1;
  panX = 0;
  panY = 0;
  updateTransform();
  document.getElementById('textOverlay').classList.remove('active');
}

function zoomIn() {
  zoomLevel = Math.min(zoomLevel + 0.3, 4);
  updateTransform();
}

function zoomOut() {
  zoomLevel = Math.max(zoomLevel - 0.3, 0.5);
  updateTransform();
}

function zoomReset() {
  zoomLevel = 1;
  panX = 0;
  panY = 0;
  updateTransform();
}

function updateTransform() {
  document.getElementById('lightboxImage').style.transform = `scale(${zoomLevel}) translate(${panX}px, ${panY}px)`;
}

const imageWrapper = document.getElementById('imageWrapper');

imageWrapper.addEventListener('mousedown', (e) => {
  if (zoomLevel > 1) {
    isDragging = true;
    startX = e.clientX - panX;
    startY = e.clientY - panY;
    imageWrapper.classList.add('dragging');
  }
});

imageWrapper.addEventListener('mousemove', (e) => {
  if (isDragging) {
    panX = e.clientX - startX;
    panY = e.clientY - startY;
    updateTransform();
  }
});

imageWrapper.addEventListener('mouseup', () => {
  isDragging = false;
  imageWrapper.classList.remove('dragging');
});

imageWrapper.addEventListener('mouseleave', () => {
  isDragging = false;
  imageWrapper.classList.remove('dragging');
});

document.getElementById('readTextBtn').addEventListener('click', () => {
  const textOverlay = document.getElementById('textOverlay');
  const textContent = document.getElementById('textContent');
  textContent.textContent = galleryData[currentCategory][currentIndex].text || 'Text will be updated later.';
  textOverlay.classList.add('active');
});

document.getElementById('textClose').addEventListener('click', () => {
  document.getElementById('textOverlay').classList.remove('active');
});

document.getElementById('lightboxClose').addEventListener('click', closeLightbox);
document.getElementById('prevImage').addEventListener('click', () => navigateImage(-1));
document.getElementById('nextImage').addEventListener('click', () => navigateImage(1));
document.getElementById('zoomIn').addEventListener('click', zoomIn);
document.getElementById('zoomOut').addEventListener('click', zoomOut);
document.getElementById('zoomReset').addEventListener('click', zoomReset);

document.getElementById('lightboxModal').addEventListener('click', (e) => {
  if (e.target.id === 'lightboxModal') closeLightbox();
});

document.addEventListener('keydown', (e) => {
  const modal = document.getElementById('lightboxModal');
  if (!modal.classList.contains('active')) return;
  
  if (e.key === 'Escape') closeLightbox();
  if (e.key === 'ArrowLeft') navigateImage(-1);
  if (e.key === 'ArrowRight') navigateImage(1);
  if (e.key === '+' || e.key === '=') zoomIn();
  if (e.key === '-' || e.key === '_') zoomOut();
  if (e.key === '0') zoomReset();
});

window.addEventListener('DOMContentLoaded', () => {
  populateGallery();
});

</script>

</body>
</html>
